name: engram-collective
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram-local
      POSTGRES_DB: engram
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["collective-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  falkordb:
    image: falkordb/falkordb:v4.16.0
    command: ["--requirepass", "engram-graph-local", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379", "127.0.0.1:53000:3000"]
    volumes: ["collective-graph:/data"]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports: ["127.0.0.1:56333:6333"]
    volumes: ["collective-vectors:/qdrant/storage"]
    restart: unless-stopped
volumes:
  collective-pg:
  collective-graph:
  collective-vectors:
