<g font-family="Arial, sans-serif"><text x="60" y="65" fill="#b4c4b6" font-size="18" font-weight="600" text-anchor="start">ENGRAM ENGINE / ENGINEERING NOTES</text><text x="60" y="125" fill="#eff3ea" font-size="38" font-weight="700" text-anchor="start">Memory types and retrieval tiers</text><text x="60" y="168" fill="#b4c4b6" font-size="22" font-weight="400" text-anchor="start">Semantic extraction follows admission; verified outcomes can become procedural memory.</text><rect x="60" y="220" width="300" height="125" rx="20" fill="#14231b" stroke="#39523f"/><text x="85" y="263" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">OBSERVATION</text><text x="85" y="299" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Persist pending episode</text><rect x="465" y="220" width="400" height="125" rx="20" fill="#14231b" stroke="#39523f"/><text x="490" y="263" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">ADMISSION</text><text x="490" y="299" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Typed policy decisions</text><rect x="1035" y="220" width="400" height="125" rx="20" fill="#14231b" stroke="#39523f"/><text x="1060" y="263" fill="#e4b982" font-size="25" font-weight="650" text-anchor="start">QUARANTINE / ARCHIVE</text><text x="1060" y="299" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Suspicious input or noise</text><path d="M360,280 L455,280" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M865,280 L1025,280" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><text x="945.0" y="268.0" fill="#b4c4b6" font-size="17" font-weight="400" text-anchor="middle">flag / reject</text><rect x="465" y="430" width="400" height="160" rx="20" fill="#14231b" stroke="#39523f"/><text x="490" y="473" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">EPISODIC</text><text x="490" y="509" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">What happened</text><text x="490" y="539" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Source and outcome history</text><rect x="1035" y="430" width="400" height="160" rx="20" fill="#14231b" stroke="#39523f"/><text x="1060" y="473" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">SEMANTIC</text><text x="1060" y="509" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Mem0 facts + source links</text><text x="1060" y="539" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Corrections retain history</text><path d="M665,345 L665,420" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><text x="665.0" y="370.5" fill="#b4c4b6" font-size="17" font-weight="400" text-anchor="middle">admit</text><path d="M865,510 L1025,510" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><text x="945.0" y="498.0" fill="#b4c4b6" font-size="17" font-weight="400" text-anchor="middle">extract</text><rect x="60" y="430" width="300" height="160" rx="20" fill="#14231b" stroke="#39523f"/><text x="85" y="473" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">PROCEDURAL</text><text x="85" y="509" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Tool descriptions</text><text x="85" y="539" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Versioned workflows</text><rect x="260" y="690" width="980" height="130" rx="20" fill="#14231b" stroke="#39523f"/><text x="285" y="733" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">RETRIEVAL TIERS</text><text x="285" y="769" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Pinned context â†’ revision-aware recent cache â†’ persistent graph retrieval</text><path d="M210,590 L450,680" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M665,590 L750,680" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1235,590 L1050,680" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><text x="60" y="875" fill="#b4c4b6" font-size="22" font-weight="400" text-anchor="start">Memory type describes meaning. Retrieval tier describes how context is loaded.</text><text x="60" y="910" fill="#b4c4b6" font-size="15" font-weight="400" text-anchor="start">16 OCT 2026  Â·  LOCAL BUILD  Â·  DIAGRAMS DESCRIBE IMPLEMENTATION</text></g></svg>