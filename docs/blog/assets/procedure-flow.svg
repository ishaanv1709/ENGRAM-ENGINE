<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="855" viewBox="0 0 1500 855">
<title>Procedures remember the exact checked bytes</title><desc>Two active versions in the local fixture; version 2 passes the same ten-test suite.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#c5e6ad"/></marker></defs>
<rect width="1500" height="855" rx="28" fill="#0b1510"/>
<g font-family="Arial, sans-serif"><text x="60" y="65" fill="#b4c4b6" font-size="18" font-weight="600" text-anchor="start">ENGRAM ENGINE / ENGINEERING NOTES</text><text x="60" y="125" fill="#eff3ea" font-size="38" font-weight="700" text-anchor="start">Procedures remember the exact checked bytes</text><text x="60" y="168" fill="#b4c4b6" font-size="22" font-weight="400" text-anchor="start">Two active versions in the local fixture; version 2 passes the same ten-test suite.</text><rect x="60" y="230" width="400" height="150" rx="20" fill="#14231b" stroke="#39523f"/><text x="85" y="273" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">PROPOSE VERSION</text><text x="85" y="309" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Actual artifacts + SHA-256</text><text x="85" y="339" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Source check event IDs</text><rect x="550" y="230" width="400" height="150" rx="20" fill="#14231b" stroke="#39523f"/><text x="575" y="273" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">VERIFY SEPARATELY</text><text x="575" y="309" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Different run, fresh container</text><text x="575" y="339" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Execute checks + hash bytes</text><rect x="1040" y="230" width="400" height="150" rx="20" fill="#14231b" stroke="#39523f"/><text x="1065" y="273" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">ACTIVATE</text><text x="1065" y="309" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Bind version and manifest</text><text x="1065" y="339" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Keep verification evidence</text><path d="M460,305 L540,305" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M950,305 L1030,305" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="550" y="535" width="400" height="150" rx="20" fill="#14231b" stroke="#39523f"/><text x="575" y="578" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">REUSE EXACT VERSION</text><text x="575" y="614" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Prepare bound artifacts</text><text x="575" y="644" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Fresh checks + reuse receipt</text><path d="M1240,390 L1240,610 L960,610" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="60" y="535" width="400" height="150" rx="20" fill="#14231b" stroke="#39523f"/><text x="85" y="578" fill="#c5e6ad" font-size="25" font-weight="650" text-anchor="start">MEASURE</text><text x="85" y="614" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Calls, tokens, execution time</text><text x="85" y="644" fill="#b4c4b6" font-size="20" font-weight="400" text-anchor="start">Keep zero / negative deltas</text><path d="M540,610 L470,610" fill="none" stroke="#c5e6ad" stroke-width="2.2" marker-end="url(#arrow)"/><text x="60" y="775" fill="#b4c4b6" font-size="22" font-weight="400" text-anchor="start">A passing test is evidence for its assertions; it is not proof of complete correctness.</text><text x="60" y="820" fill="#b4c4b6" font-size="15" font-weight="400" text-anchor="start">16 OCT 2026  Â·  LOCAL BUILD  Â·  DIAGRAMS DESCRIBE IMPLEMENTATION</text></g></svg>