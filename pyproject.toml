[project]
name = "engram-collective"
version = "1.0.0"
description = "Persistent memory and coordination for Deep Agent teams"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.0",
  "psycopg[binary,pool]==3.3.6",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "falkordb==1.8.0",
  "deepagents==0.3.3",
  "langchain-anthropic==1.7.6",
  "langgraph-checkpoint-postgres==3.2.0",
  "mem0ai==0.1.118",
  "mem0-falkordb==0.4.1",
  "docker==7.2.0",
  "python-multipart==0.0.32",
  "pypdf==6.20.1",
  "langchain-mcp-adapters==0.3.2",
  "networkx>=3.4",
  "numpy>=2.0",
  "langchain-openai>=1.1.9",
  "qdrant-client==1.18.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[tool.pytest.ini_options]
testpaths = ["collective/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires real local databases and embeddings", "providers: requires actual provider credentials"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
